name: publish

# Registry publish. Fires on the same `v*` tags as release.yml, but owns a
# different concern: release.yml ships binaries, this ships the crate.
#
# Setup (one time): repo Settings -> Secrets -> Actions -> new repository
# secret `CARGO_REGISTRY_TOKEN` with a crates.io token (scope: publish).
# Without it this workflow fails closed at the publish step — by design.
#
# Flow per release:
#   1. `mise run bump patch|minor|major` (updates Cargo.toml + extension.toml)
#   2. commit, tag `v<version>`, push tag
#   3. release.yml builds binaries, publish.yml runs `cargo publish`

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag: $TAG / Cargo.toml: $CARGO"
          test "$TAG" = "$CARGO" || { echo "tag v$TAG does not match Cargo.toml $CARGO — did you run mise run bump?"; exit 1; }

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Smoke-test the published crate
        run: |
          sleep 60
          cargo install omniroute-zed --locked
          omniroute-zed --version
