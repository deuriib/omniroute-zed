name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Native toolchain per runner OS. NOTE: mise.toml pins
      # `stable-x86_64-pc-windows-gnu` for local dev on a machine without
      # MSVC Build Tools — that triple cannot install on Linux/macOS
      # runners, so CI deliberately does NOT use mise for the toolchain.
      # The mise tasks are thin cargo wrappers; CI calls cargo directly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Verify the binary builds in release
        run: cargo build --release

      - name: Validate extension manifest + snippets
        run: |
          python3 -c "import json,tomllib; tomllib.load(open('extension/extension.toml','rb')); json.load(open('extension/snippets/snippets.json')); print('manifest + snippets valid')"